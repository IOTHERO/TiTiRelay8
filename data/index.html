<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>TiTi Relay-8</title>
<style>
:root{--bg:#0a0c11;--bg2:#10131b;--card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.06);--line:rgba(255,255,255,.08);
--tx:#eef0f6;--mut:#8b93a7;--gold:#d9b46a;--gold2:#f6dfa6;--ok:#36d399;--bad:#ff5d6c;--warn:#ffb547;--info:#6aa8ff;
--r:18px;--sh:0 10px 40px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Vazirmatn,"Segoe UI",Tahoma,system-ui,sans-serif;color:var(--tx);background:var(--bg);
background-image:radial-gradient(1200px 600px at 85% -10%,rgba(217,180,106,.13),transparent 60%),
radial-gradient(900px 500px at -10% 110%,rgba(106,168,255,.08),transparent 60%);background-attachment:fixed;
font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
[dir=ltr] body{font-family:"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
/* login */
#login{min-height:100%;display:grid;place-items:center;padding:24px}
.lbox{width:100%;max-width:380px;padding:34px 28px;border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
border:1px solid var(--line);box-shadow:var(--sh);backdrop-filter:blur(18px);animation:rise .6s ease both;text-align:center}
.logo{width:74px;height:74px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;
background:conic-gradient(from 210deg,var(--gold),#7a5a22,var(--gold2),var(--gold));box-shadow:0 0 40px rgba(217,180,106,.35);animation:glow 3s ease-in-out infinite}
.logo svg{width:40px;height:40px}
.lbox h1{font-size:22px;margin-bottom:4px}
.lbox p{color:var(--mut);margin-bottom:22px;font-size:13px}
/* layout */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
aside{position:sticky;top:0;height:100vh;padding:22px 16px;border-inline-end:1px solid var(--line);background:rgba(10,12,17,.6);backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 20px}
.brand .logo{width:42px;height:42px;margin:0;border-radius:13px}.brand .logo svg{width:22px;height:22px}
.brand b{display:block;font-size:15px}.brand small{color:var(--mut);font-size:11px}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;cursor:pointer;color:var(--mut);border:1px solid transparent;transition:.25s;background:none;text-align:start;width:100%}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{color:var(--tx);background:var(--card)}
.nav.on{color:var(--tx);background:linear-gradient(135deg,rgba(217,180,106,.18),rgba(217,180,106,.04));border-color:rgba(217,180,106,.3)}
.nav.on svg{color:var(--gold)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
main{padding:22px clamp(16px,3vw,36px) 120px;max-width:1180px;width:100%}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
header h2{font-size:22px;font-weight:700;margin-inline-end:auto}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--mut);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2s infinite}
.dot.bad{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.dot.warn{background:var(--warn);box-shadow:0 0 10px var(--warn);animation:pulse 1s infinite}
.page{display:none;animation:rise .45s ease both}.page.on{display:block}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;position:relative;overflow:hidden;transition:border-color .3s,transform .3s}
.card h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.card h3 small{color:var(--mut);font-weight:400;font-size:12px;margin-inline-start:auto}
.card .sub{color:var(--mut);font-size:12.5px;margin:-8px 0 14px}
.stat{padding:18px}
.stat .k{color:var(--mut);font-size:12px}
.stat .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
[dir=rtl] .stat .v{text-align:right}
.hero{background:linear-gradient(135deg,rgba(217,180,106,.16),rgba(255,255,255,.02) 55%);border-color:rgba(217,180,106,.25)}
.hero .big{font-size:28px;font-weight:800}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;margin-bottom:12px;font-size:13px;border:1px solid}
.alert.warn{background:rgba(255,181,71,.08);border-color:rgba(255,181,71,.3);color:#ffd79a}
.alert.bad{background:rgba(255,93,108,.08);border-color:rgba(255,93,108,.3);color:#ffb3bb}
.alert.info{background:rgba(106,168,255,.08);border-color:rgba(106,168,255,.3);color:#bcd6ff}
/* forms */
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
.in,select.in,textarea.in{width:100%;padding:11px 14px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);outline:none;transition:.2s}
.in:focus{border-color:rgba(217,180,106,.6);box-shadow:0 0 0 4px rgba(217,180,106,.12)}
.in.ltr{direction:ltr;text-align:left}
textarea.in{min-height:110px;font-family:Consolas,monospace;font-size:12px;direction:ltr}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 14px}
.pw{position:relative}.pw .eye{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);cursor:pointer;padding:6px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;cursor:pointer}
.tg input{display:none}
.tg i{width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;transition:.3s;flex:none}
.tg i:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tg input:checked+i{background:linear-gradient(135deg,var(--gold),#b48a3c)}
[dir=rtl] .tg input:checked+i:after{transform:translateX(-20px)}
[dir=ltr] .tg input:checked+i:after{transform:translateX(20px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card2);cursor:pointer;transition:.2s;font-weight:600;white-space:nowrap}
.btn:hover{border-color:rgba(255,255,255,.2);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--gold),#b8893a);color:#1a1307;border:0;box-shadow:0 6px 24px rgba(217,180,106,.3)}
.btn.red{background:rgba(255,93,108,.12);border-color:rgba(255,93,108,.35);color:#ff9aa5}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:17px;height:17px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* mode cards */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.mode{cursor:pointer;padding:22px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);transition:.3s;text-align:start}
.mode svg{width:34px;height:34px;color:var(--mut);transition:.3s}
.mode b{display:block;font-size:17px;margin:10px 0 2px}.mode span{color:var(--mut);font-size:12.5px}
.mode.on{border-color:var(--gold);background:linear-gradient(150deg,rgba(217,180,106,.16),rgba(217,180,106,.02));box-shadow:0 0 0 4px rgba(217,180,106,.08),var(--sh)}
.mode.on svg{color:var(--gold)}
/* scan */
.nets{max-height:260px;overflow:auto;margin:-4px 0 14px;display:flex;flex-direction:column;gap:6px}
.net{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--line);cursor:pointer;transition:.2s}
.net:hover{border-color:rgba(217,180,106,.45)}.net.sel{border-color:var(--gold);background:rgba(217,180,106,.08)}
.net b{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
.sig{display:flex;gap:2px;align-items:flex-end;height:16px}.sig i{width:4px;border-radius:2px;background:rgba(255,255,255,.15)}
.sig i.on{background:var(--gold)}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:rot .8s linear infinite;display:inline-block}
/* servers */
.srv{border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:rgba(0,0,0,.15);overflow:hidden}
.srv>.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.srv>.hd b{flex:1}.srv>.bd{padding:4px 14px 14px;display:none}.srv.open>.bd{display:block}
.num{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--card2);font-size:12px;font-weight:700}
/* relays */
.relays{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.rl{padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:.35s;position:relative;overflow:hidden}
.rl:before{content:"";position:absolute;inset:0;background:radial-gradient(240px 140px at 50% -20%,rgba(54,211,153,.25),transparent 70%);opacity:0;transition:.4s}
.rl.on{border-color:rgba(54,211,153,.45);box-shadow:0 0 30px rgba(54,211,153,.12)}
.rl.on:before{opacity:1}
.rl.na{opacity:.45}
.rl .top{display:flex;align-items:center;justify-content:space-between;position:relative}
.rl .nm{font-weight:700}.rl .no{font-size:11px;color:var(--mut)}
.pwr{width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;margin:16px auto 12px;position:relative;
background:radial-gradient(circle at 35% 30%,#2a2f3d,#141720);box-shadow:inset 0 2px 6px rgba(255,255,255,.08),0 8px 20px rgba(0,0,0,.5);transition:.3s;color:var(--mut)}
.pwr svg{width:28px;height:28px}
.rl.on .pwr{color:#062016;background:radial-gradient(circle at 35% 30%,#6ff2bf,#1fae74);box-shadow:0 0 0 6px rgba(54,211,153,.15),0 0 36px rgba(54,211,153,.55)}
.rl.wait .pwr{animation:pulse .6s infinite}
.rl .meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--mut);position:relative}
.rl .st{font-weight:700;letter-spacing:.5px}.rl.on .st{color:var(--ok)}
.pulse{display:flex;gap:6px;margin-top:12px;position:relative}
.pulse .in{padding:6px 8px;text-align:center;direction:ltr}
.badge{font-size:10px;padding:2px 8px;border-radius:99px;background:rgba(255,181,71,.15);color:var(--warn)}
/* inputs */
.dips{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;direction:ltr}
.dip{text-align:center;font-size:11px;color:var(--mut)}
.dip .sw{height:54px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--line);position:relative;margin-bottom:6px}
.dip .sw:after{content:"";position:absolute;left:5px;right:5px;height:22px;bottom:5px;border-radius:7px;background:#3a3f4d;transition:.35s cubic-bezier(.5,1.6,.5,1)}
.dip.on .sw:after{bottom:27px;background:linear-gradient(var(--gold2),var(--gold));box-shadow:0 0 14px rgba(217,180,106,.6)}
.dip.cfg.on .sw:after{background:linear-gradient(#ffd0a0,var(--warn))}
.addr{display:flex;align-items:baseline;gap:10px;margin-top:16px}
.addr b{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{color:var(--mut);font-weight:500;font-size:11.5px}
td .in{padding:7px 10px}
code{font-family:Consolas,monospace;font-size:12px;background:rgba(255,255,255,.06);padding:1px 6px;border-radius:6px;direction:ltr;display:inline-block}
/* log */
.log{height:330px;overflow:auto;background:#05070b;border:1px solid var(--line);border-radius:14px;padding:12px;font-family:Consolas,monospace;font-size:12px;direction:ltr;text-align:left}
.log div{white-space:pre-wrap;word-break:break-word;padding:1px 0;animation:fade .3s}
.log .l0{color:#ff8a95}.log .l1{color:#ffc76b}.log .l2{color:#c9d1e3}.log .l3{color:#7f889c}
.log span{color:#4d566a;margin-right:8px}
.prog{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .2s}
/* product label */
.lbl{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.qrbox{background:#fff;border-radius:16px;padding:10px;box-shadow:0 0 0 1px rgba(217,180,106,.35),0 10px 30px rgba(0,0,0,.4);line-height:0}
.qrbox svg{display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv span{color:var(--mut)}.kv b{direction:ltr;text-align:start;font-family:Consolas,monospace;font-weight:600;word-break:break-all}
@media(max-width:560px){.lbl{grid-template-columns:1fr;justify-items:center}}
@media print{body *{visibility:hidden!important}#labelCard,#labelCard *{visibility:visible!important}
#labelCard{position:absolute;left:0;top:0;background:#fff;color:#000;border:0}#labelCard .bar,#labelCard details,#labelCard .sub{display:none!important}}
/* save bar */
.savebar{position:fixed;bottom:18px;left:50%;transform:translate(-50%,140%);display:flex;align-items:center;gap:14px;padding:10px 12px 10px 18px;border-radius:18px;
background:rgba(20,22,30,.92);border:1px solid rgba(217,180,106,.35);box-shadow:var(--sh);backdrop-filter:blur(14px);transition:.4s cubic-bezier(.3,1.4,.5,1);z-index:30;visibility:hidden}
[dir=rtl] .savebar{padding:10px 18px 10px 12px}
.savebar.show{transform:translate(-50%,0);visibility:visible}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .25s}
.modal .box{width:100%;max-width:420px;background:#141720;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--sh);animation:rise .35s}
.modal h3{font-size:18px;margin-bottom:8px}.modal p{color:var(--mut);margin-bottom:18px}
.swstate{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);margin-bottom:18px;font-weight:600}
#toasts{position:fixed;top:16px;inset-inline-end:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{padding:12px 16px;border-radius:14px;background:#171a24;border:1px solid var(--line);box-shadow:var(--sh);animation:slide .35s;min-width:220px;border-inline-start:3px solid var(--gold)}
.toast.bad{border-inline-start-color:var(--bad)}.toast.ok{border-inline-start-color:var(--ok)}
/* mobile dock */
.dock{display:none}
@media(max-width:860px){
#app{grid-template-columns:1fr}aside{display:none}
main{padding-bottom:130px}
.dock{display:flex;position:fixed;bottom:12px;left:12px;right:12px;justify-content:space-around;padding:8px;border-radius:22px;background:rgba(18,20,28,.85);border:1px solid var(--line);backdrop-filter:blur(18px);z-index:20;box-shadow:var(--sh)}
.dock .nav{flex-direction:column;gap:2px;font-size:10.5px;padding:8px 6px;justify-content:center;align-items:center;text-align:center}
.savebar{bottom:96px}
.modes{grid-template-columns:1fr}
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.45}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes glow{50%{box-shadow:0 0 60px rgba(217,180,106,.55)}}
</style>
</head>

</svg>

<section id="login">
  <div class="lbox">
    <div class="logo"><svg><use href="#i-logo"/></svg></div>
    <h1><span class="gold" id="lname">TiTi Relay-8</span></h1>
    <p data-t="loginSub"></p>
    <label class="f"><span data-t="adminPass"></span>
      <div class="pw"><input class="in ltr" id="lpass" type="password" autocomplete="current-password">
      <button class="eye" type="button" data-eye="lpass"><svg width="18" height="18"><use href="#i-eye"/></svg></button></div></label>
    <button class="btn pri" style="width:100%" id="lbtn" data-t="signIn"></button>
    <p id="lerr" style="color:var(--bad);margin:12px 0 0"></p>
    <div style="margin-top:18px"><button class="btn sm" data-lang></button></div>
  </div>
</section>

<div id="app" class="hide">
  <aside>
    <div class="brand"><div class="logo"><svg><use href="#i-logo"/></svg></div><div><b id="bname">TiTi Relay-8</b><small id="bfw"></small></div></div>
    <div id="navs"></div>
    <div class="side-foot">
      <button class="btn sm" data-lang></button>
      <button class="btn sm red" data-restart><svg><use href="#i-re"/></svg><span data-t="restart"></span></button>
    </div>
  </aside>
  <main>
    <header>
      <h2 id="ptitle"></h2>
      <span class="chip"><span class="dot" id="wsdot"></span><span id="wstx"></span></span>

async function api(path,body,method){
  const o={method:method||(body!==undefined?"POST":"GET"),headers:{"X-Auth":token}};
  if(body!==undefined){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}

  // [table, first, last, access (rw|r|w), fa, en]; PLC address = table base + address + 1
  const R=[["Coil",0,7,"rw","رله ۱ تا ۸ (FC1/5/15)","Relays 1..8 (FC1/5/15)"],
    ["Discrete",0,6,"r","دیپ AD1..AD7 (FC2)","DIP AD1..AD7 (FC2)"],["Discrete",7,7,"r","کلید کانفیگ","Config switch"],
    ["Holding",0,0,"rw","ماسک رله‌ها (بیت ۰ = رله ۱)","Relay mask (bit 0 = relay 1)"],["Holding",1,1,"w","۱ = همه خاموش، ۲ = شناسایی","1 = all OFF, 2 = identify"],
    ["Holding",2,9,"w","پالس رله ۱ تا ۸ (×۰٫۱ ثانیه)","Pulse relay 1..8 (x0.1 s)"],["Holding",20,27,"rw","رله ۱ تا ۸، هر کدام یک رجیستر (۰/۱)","Relay 1..8, one register each (0/1)"],
    ["Input",0,0,"r","وضعیت رله‌ها","Relay state"],["Input",1,3,"r","دیپ خام / آدرس Slave / نسخه","DIP raw / slave address / firmware"],
    ["Input",4,5,"r","زمان کارکرد (۳۲ بیتی)","Uptime (32-bit)"],["Input",6,7,"r","فریم سالم / خطای CRC","Good frames / CRC errors"],
    ["Input",8,9,"r","تعداد بوت / حالت ایمن","Boot count / safe mode"],["Input",10,25,"r","دفعات کار رله‌ها (۳۲ بیتی)","Relay cycles (32-bit)"]];
  const base={Coil:0,Discrete:10000,Input:30000,Holding:40000};
  const acc={rw:t("accRW"),r:t("accR"),w:t("accW")};
  const p5=n=>String(n).padStart(5,"0");
  const tb=$("#regs");tb.innerHTML="";
  for(const r of R){const tr=el("tr");tr.appendChild(el("td",null,r[0]));
    const c=el("td");c.appendChild(el("code",null,r[1]===r[2]?String(r[1]):r[1]+".."+r[2]));tr.appendChild(c);
    const b=base[r[0]],c2=el("td");c2.appendChild(el("code",null,r[1]===r[2]?p5(b+r[1]+1):p5(b+r[1]+1)+".."+p5(b+r[2]+1)));tr.appendChild(c2);
    tr.appendChild(el("td",null,acc[r[3]]));tr.appendChild(el("td",null,lang==="fa"?r[4]:r[5]));tb.appendChild(tr)}
}
/* ---------- live state ---------- */
function fmtUp(s){const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;const p=n=>String(n).padStart(2,"0");return (d?d+t("days")+" ":"")+p(h)+":"+p(m)+":"+p(x)}
function render(){
  if(!ST||ST.relays==null)return;
  let on=0;
  for(let i=0;i<8;i++){const v=(ST.relays>>i)&1;on+=v;const c=$("#rl"+i);if(c){c.classList.toggle("on",!!v);c.classList.remove("wait");const st=c.querySelector(".st");if(st)st.textContent=t(v?"on":"off");
      const cy=c.querySelector(".cy");if(cy&&ST.cycles)cy.textContent=ST.cycles[i]}
    const m=$("#mr"+i);if(m)m.classList.toggle("on",!!v);
    const d=$("#dp"+i);if(d)d.classList.toggle("on",!!((ST.dip>>i)&1))}
  $("#onc").textContent=on;$("#donc").textContent=on+" / "+((ST.fitted||0).toString(2).split("1").length-1);
  const a=ST.dip&127;$("#dipv").textContent=a;$("#dipbin").textContent=a.toString(2).padStart(7,"0");
  $("#dipAddr").textContent=t("dipAddress")+": "+a+(a<1||a>247?" ⚠":"");
  $("#cfgtx").textContent=t(ST.cfg?"on":"off");$("#cfgdot").className="dot "+(ST.cfg?"warn":"ok");
  $("#sup").textContent=fmtUp(ST.up);$("#sad").textContent=ST.addr||"—";$("#shp").textContent=Math.round(ST.heap/1024)+" KB";
  $("#srr").textContent=ST.reset;$("#sbt").textContent=ST.boots;$("#scl").textContent=ST.clients;
  $("#slk").textContent=t(ST.localKey?"keyOk":"keyNone");$("#srl").textContent=ST.rules?ST.rules+" · v"+ST.rulesVer:t("none");
  const w=ST.wifi||{};$("#wttx").textContent=w.st==="connected"?t("connected")+" · "+w.ip+" · "+w.rssi+" dBm":t(w.st||"idle");
  $("#wtdot").className="dot"+(w.st==="connected"?" ok":w.st==="connecting"||w.st==="retry"?" warn":"");
  if(mtIdx>=0){const c=$("#mt"+mtIdx);if(c&&ST.mqttTest&&ST.mqttTest!=="testing"){c.textContent=ST.mqttTest==="ok"?"✓ "+t("ok"):"✗ "+ST.mqttTest;c.style.color=ST.mqttTest==="ok"?"var(--ok)":"var(--bad)"}}
  $("#walk").textContent=ST.walk>=0?"■ "+t("walk"):t("walk");
  const al=$("#alerts");al.innerHTML="";
  const add=(k,c)=>al.appendChild(el("div","alert "+c,t(k)));
  if(ST.safe)add("safe","bad");if(S&&S.system.adminDefault)add("adminDef","warn");if(ST.cfg)add("cfgStill","info");if(S&&!S.mode)add("modeNone","warn");
  const m=$("#rsmodal");if(m){const on=ST.cfg;m.querySelector(".dot").className="dot "+(on?"warn":"ok");m.querySelector("b").textContent=t(on?"rsOn":"rsOff")}
  if(ST.log&&ST.log.length&&!logPaused){const L=$("#log");const stick=L.scrollTop+L.clientHeight>=L.scrollHeight-20;
    for(const [s,l,x] of ST.log){const d=el("div","l"+l);d.appendChild(el("span",null,fmtUp(s)));d.appendChild(document.createTextNode(x));L.appendChild(d)}
    while(L.childNodes.length>400)L.firstChild.remove();if(stick)L.scrollTop=L.scrollHeight}
}
function info2(){
  if(!S)return;$("#dname").textContent=S.deviceName;$("#bname").textContent=S.deviceName;
  $("#dmode").textContent=t(S.mode===1?"modeW":S.mode===2?"modeR":"modeU");
}
function connectWs(){
  if(ws)try{ws.close()}catch(e){}
  ws=new WebSocket("ws://"+location.host+"/ws");
  ws.onopen=()=>{ws.send(JSON.stringify({auth:token}));wsOk=true;wsUi()};
  ws.onmessage=e=>{try{const j=JSON.parse(e.data);if(j.t==="state"){ST=j;render();info2()}}catch(x){}};
  ws.onclose=()=>{wsOk=false;wsUi();if(token)setTimeout(connectWs,2000)};
}
function wsUi(){$("#wsdot").className="dot "+(wsOk?"ok":"bad");$("#wstx").textContent=t(wsOk?"live":"offline")}
/* ---------- product label ---------- */
let LB={qr:"",serial:""},codeShown=false,qrMod=null;
function parseClaim(q){const m=/\/claim\/([^/]+)\/([^/?#]+)/.exec(q||"");return m?{id:decodeURIComponent(m[1]),code:decodeURIComponent(m[2])}:null}
async function loadLabel(){try{LB=await api("/api/label")}catch(e){return}renderLabel()}
async function renderLabel(){
  const c=parseClaim(LB.qr),box=$("#qrBox");
  $("#lblSn").textContent=LB.serial||"—";$("#lblId").textContent=c?c.id:"—";
  $("#lblCode").textContent=c?(codeShown?c.code:c.code.replace(/[^-]/g,"•")):"—";
  $("#lblShow").textContent=t(codeShown?"hideCode":"showCode");$("#lblShow").disabled=!c;$("#lblPrint").disabled=!LB.qr;
  $("#lblNone").classList.toggle("hide",!!LB.qr);$("#lblHint").textContent=LB.qr?t("firstUse"):"";
  $("#lblQrIn").value=LB.qr;$("#lblSnIn").value=LB.serial;
  box.innerHTML="";box.classList.toggle("hide",!LB.qr);
  if(LB.qr){try{qrMod=qrMod||await import("/static/qr.js");box.appendChild(qrMod.qrSvg(LB.qr,190,t("label")))}catch(e){box.classList.add("hide")}}
}
async function saveLabel(){try{await api("/api/label",{qr:$("#lblQrIn").value.trim(),serial:$("#lblSnIn").value.trim()});toast(t("saved"),"ok");loadLabel()}catch(e){toast(t("invalid")+"QR","bad")}}
/* ---------- system ---------- */
function modal(build){const m=$("#modal");m.innerHTML="";const bg=el("div","modal");const box=el("div","box");build(box,()=>{m.innerHTML=""});bg.appendChild(box);
  bg.onclick=e=>{if(e.target===bg)m.innerHTML=""};m.appendChild(bg)}
function restartDlg(){
  modal((b,close)=>{b.id="rsmodal";b.appendChild(el("h3",null,t("rsTitle")));b.appendChild(el("p",null,t("rsText")));
    const s=el("div","swstate");s.appendChild(el("span","dot"));s.appendChild(el("b"));b.appendChild(s);
    const bar=el("div","bar");const go=el("button","btn pri",t("rsGo"));go.onclick=async()=>{await api("/api/action",{do:"restart"}).catch(()=>{});close();waitBack()};
    const c=el("button","btn",t("cancel"));c.onclick=close;bar.appendChild(go);bar.appendChild(c);b.appendChild(bar);render()})
}
function waitBack(){toast(t("restarting"));token="";try{sessionStorage.removeItem("tk")}catch(e){}setTimeout(()=>location.reload(),9000)}
function factoryDlg(){
  modal((b,close)=>{b.appendChild(el("h3",null,t("facTitle")));b.appendChild(el("p",null,t("facText")));const i=el("input","in ltr");i.placeholder="RESET";b.appendChild(i);
    const bar=el("div","bar");bar.style.marginTop="16px";const go=el("button","btn red",t("factory"));go.onclick=async()=>{try{await api("/api/action",{do:"factory",confirm:i.value});close();waitBack()}catch(e){toast(e.message,"bad")}};
    const c=el("button","btn",t("cancel"));c.onclick=close;bar.appendChild(go);bar.appendChild(c);b.appendChild(bar)})
}
function ota(){
  const f=$("#otaFile").files[0];if(!f)return;const fd=new FormData();fd.append("firmware",f,f.name);
  const x=new XMLHttpRequest();x.open("POST","/api/ota"+($("#otaFs").checked?"?fs=1":""));x.setRequestHeader("X-Auth",token);
  x.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.round(e.loaded*100/e.total);$("#otaBar").style.width=p+"%";$("#otaTx").textContent=p+"%"}};
  x.onload=()=>{if(x.status===200){$("#otaTx").textContent="✓";waitBack()}else{let m="";try{m=JSON.parse(x.responseText).field}catch(e){}$("#otaTx").textContent="✗ "+m;toast(t("failed")+" "+m,"bad")}};
  x.onerror=()=>toast(t("failed"),"bad");$("#otaBtn").disabled=true;x.onloadend=()=>{$("#otaBtn").disabled=false};x.send(fd);
}
async function backup(){const r=await fetch("/api/backup",{headers:{"X-Auth":token}});const b=await r.blob();const a=el("a");a.href=URL.createObjectURL(b);a.download="titi-relay8-backup.json";a.click()}
async function restoreFile(f){try{const j=JSON.parse(await f.text());await api("/api/restore",j);toast(t("saved"),"ok");S=await api("/api/settings");S0=JSON.stringify(S);applyLang()}catch(e){toast(e.field?t("invalid")+e.field:e.message,"bad")}}
/* ---------- wiring ---------- */
document.addEventListener("input",onInput);document.addEventListener("change",onInput);
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const a=e.target.closest("[data-all]");if(a){all(a.dataset.all==="1");return}
  const m=e.target.closest("[data-mode]");if(m&&S){S.mode=+m.dataset.mode;modeUi();dirty();if(S.mode===1&&!$("#nets").childNodes.length)scan(true);return}
  if(e.target.closest("[data-restart]")){restartDlg();return}
  if(e.target.closest("[data-lang]")){lang=lang==="fa"?"en":"fa";try{localStorage.setItem("lang",lang)}catch(x){}applyLang();return}
  const ey=e.target.closest("[data-eye]");if(ey){const i=document.getElementById(ey.dataset.eye);i.type=i.type==="password"?"text":"password"}
});
$("#lbtn").onclick=login;$("#lpass").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("#save").onclick=save;$("#discard").onclick=discard;$("#scanBtn").onclick=()=>scan(true);
$("#wtest").onclick=async()=>{if(JSON.stringify(S)!==S0){toast(t("saveFirst"),"bad");return}await api("/api/action",{do:"wifiTest"});toast(t("testing")+"…")};
$("#walk").onclick=()=>api("/api/action",{do:ST.walk>=0?"walkStop":"walk"});$("#ident").onclick=()=>api("/api/action",{do:"identify"});
$("#lblShow").onclick=()=>{codeShown=!codeShown;renderLabel()};$("#lblPrint").onclick=()=>window.print();$("#lblSave").onclick=saveLabel;
$("#otaBtn").onclick=ota;$("#bkBtn").onclick=backup;$("#rsFile").onchange=e=>{if(e.target.files[0])restoreFile(e.target.files[0])};$("#facBtn").onclick=factoryDlg;
$("#caSave").onclick=async()=>{try{await api("/api/ca",{pem:$("#ca").value.trim()});toast(t("saved"),"ok");$("#caState").textContent=t($("#ca").value.trim()?"caSet":"caNone")}catch(e){toast(t("invalid")+"CA","bad")}};
$("#logPause").onclick=()=>{logPaused=!logPaused;$("#logPause").textContent=t(logPaused?"resume":"pause")};$("#logClear").onclick=()=>{$("#log").innerHTML=""};
window.addEventListener("beforeunload",e=>{if(S&&JSON.stringify(S)!==S0){e.preventDefault();e.returnValue=""}});
buildNav();go("dash");applyLang();
fetch("/api/info").then(r=>r.json()).then(j=>{info=j;$("#lname").textContent=j.name;$("#bfw").textContent="v"+j.fw+" · "+j.model;$("#dfw").textContent="FW "+j.fw;$("#dmac").textContent=j.mac;$("#fwv").textContent="v"+j.fw}).catch(()=>{});
if(token)start();
setInterval(()=>{if(!wsOk&&token&&!$("#app").classList.contains("hide"))api("/api/state").then(j=>{ST=j;render();info2()}).catch(()=>{})},1500);
setInterval(()=>{if(S&&page==="conn")$("#caState").textContent=t(S.caSet?"caSet":"caNone")},2000);
</script>
</body>
